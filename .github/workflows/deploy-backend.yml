# Updates the Supabase backend (database changes and server functions) from the repository.
# Needs repository secrets SUPABASE_ACCESS_TOKEN and SUPABASE_DB_PASSWORD (see docs/SETUP.md, items 10 and 11).
name: Deploy backend
on:
  push:
    branches: [main]
    paths: ['supabase/**', 'src/core/**']
  workflow_dispatch:
concurrency: deploy-backend
jobs:
  deploy:
    runs-on: ubuntu-latest
    env:
      SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
      SUPABASE_DB_PASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}
      PROJECT_REF: ohawfftzgjuqwbilovmy
    steps:
      - uses: actions/checkout@v4
      - uses: supabase/setup-cli@v1
        with: { version: latest }
      - name: Check the secrets are set
        id: secrets
        run: |
          if [ -z "$SUPABASE_ACCESS_TOKEN" ] || [ -z "$SUPABASE_DB_PASSWORD" ]; then
            echo "::warning::Skipped: add SUPABASE_ACCESS_TOKEN and SUPABASE_DB_PASSWORD as repository secrets to deploy automatically (docs/SETUP.md items 10 and 11)"
            echo "ready=false" >> "$GITHUB_OUTPUT"
          else
            echo "ready=true" >> "$GITHUB_OUTPUT"
          fi
      - if: steps.secrets.outputs.ready == 'true'
        run: node scripts/sync-shared.mjs
      - if: steps.secrets.outputs.ready == 'true'
        run: supabase link --project-ref "$PROJECT_REF" --password "$SUPABASE_DB_PASSWORD"
      - name: Apply database changes
        if: steps.secrets.outputs.ready == 'true'
        run: supabase db push --password "$SUPABASE_DB_PASSWORD"
      - name: Deploy server functions
        if: steps.secrets.outputs.ready == 'true'
        run: supabase functions deploy --project-ref "$PROJECT_REF"
